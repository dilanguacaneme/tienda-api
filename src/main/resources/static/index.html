<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda - Inventario</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Tienda Doña Rosa</h1>


<h2>Inventario</h2>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Total</th>
        <th></th>
    </tr>
    </thead>
    <tbody id="tablaProductos"></tbody>
</table>
<button class="secondary" onclick="cargarProductos()">Actualizar lista de productos</button>
<span id="totalInventario"></span>

<h3>Crear producto</h3>
<form id="formCrear">
    <input type="text" id="cNombre" placeholder="Nombre" required>
    <input type="number" id="cPrecio" placeholder="Precio" required>
    <input type="number" id="cCantidad" placeholder="Cantidad" required>
    <button type="submit">Crear</button>
</form>
<div id="msgCrear" class="msg"></div>

<h3>Actualizar producto</h3>
<form id="formActualizar">
    <input type="number" id="uId" placeholder="ID" required>
    <input type="text" id="uNombre" placeholder="Nombre (opcional)">
    <input type="number" id="uPrecio" placeholder="Precio (opcional)">
    <input type="number" id="uCantidad" placeholder="Cantidad (opcional)">
    <button type="submit">Actualizar</button>
</form>
<div id="msgActualizar" class="msg"></div>

<h2>Productos por acabarse</h2>
<button class="secondary" onclick="cargarProntoAcabar()">Consultar</button>
<ul id="listaAcabarse"></ul>

<h2>Crear factura</h2>
<div><strong>Cliente:</strong> <input type="text" id="fCliente" placeholder="Nombre del cliente"></div>
<div id="detalles"></div>
<button class="secondary" type="button" onclick="agregarDetalle()">+ Agregar producto</button>
<br><br>
<button onclick="crearFactura()">Crear factura</button>
<div id="msgFactura" class="msg"></div>

<script src="js/script.js"></script>
</body>
</html>
